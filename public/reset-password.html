<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AVEN</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-[#fafafa] min-h-screen text-gray-900 font-sans flex flex-col justify-between antialiased selection:bg-black selection:text-white">

    <!-- HEADER (Matching index.html) -->
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <a href="/" class="text-2xl font-bold tracking-widest text-black uppercase">AVEN</a>
                    <span class="text-gray-300">/</span>
                    <span class="text-xs uppercase tracking-widest text-gray-500 font-medium">Account Recovery</span>
                </div>
                <a href="/login.html"
                    class="text-xs uppercase tracking-wider text-gray-600 hover:text-black border-b border-gray-300 hover:border-black pb-0.5 transition">
                    Back to Login
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN RECOVERY CARD -->
    <main class="max-w-md w-full mx-auto p-4 sm:p-6 flex-grow flex items-center justify-center my-6">
        <div
            class="bg-white border border-gray-200/80 p-8 sm:p-10 rounded-sm shadow-[0_4px_25px_rgba(0,0,0,0.03)] w-full">

            <div class="text-center mb-8">
                <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400 block mb-1">Security &
                    Access</span>
                <h1 id="flow-title" class="text-2xl font-light tracking-tight uppercase text-black">Reset Password</h1>
                <p id="flow-desc" class="text-xs text-gray-500 mt-1">Enter your registered email address to receive an
                    OTP.</p>
            </div>

            <!-- STEP 1: Enter Email -->
            <form id="step-email-form" onsubmit="handleSendOtp(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-gray-500 mb-1 font-medium">Email
                        Address</label>
                    <input type="email" id="reset-email" required placeholder="you@example.com"
                        class="w-full border border-gray-300 p-2.5 text-xs focus:outline-none focus:border-black rounded-sm">
                </div>
                <button type="submit" id="btn-send-otp"
                    class="w-full bg-black text-white py-3.5 text-xs uppercase tracking-widest hover:bg-neutral-800 transition font-medium rounded-sm shadow-sm">
                    Send 6-Digit OTP
                </button>
            </form>

            <!-- STEP 2: Verify OTP -->
            <form id="step-otp-form" onsubmit="handleVerifyOtp(event)" class="space-y-4 hidden">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-[11px] uppercase tracking-wider text-gray-500 font-medium">Enter
                            6-Digit OTP</label>
                        <button type="button" onclick="resendOtp()"
                            class="text-[10px] text-gray-400 hover:text-black uppercase tracking-wider">Resend
                            OTP</button>
                    </div>
                    <input type="text" id="reset-otp" required maxlength="6" placeholder="123456"
                        class="w-full border border-gray-300 p-2.5 text-center tracking-[0.5em] text-base font-bold focus:outline-none focus:border-black rounded-sm">
                </div>
                <button type="submit" id="btn-verify-otp"
                    class="w-full bg-black text-white py-3.5 text-xs uppercase tracking-widest hover:bg-neutral-800 transition font-medium rounded-sm shadow-sm">
                    Verify Code
                </button>
            </form>

            <!-- STEP 3: Enter New Passwords -->
            <form id="step-password-form" onsubmit="handleUpdatePassword(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-gray-500 mb-1 font-medium">New
                        Password</label>
                    <input type="password" id="new-password" required placeholder="••••••••"
                        class="w-full border border-gray-300 p-2.5 text-xs focus:outline-none focus:border-black rounded-sm">
                </div>
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-gray-500 mb-1 font-medium">Confirm New
                        Password</label>
                    <input type="password" id="confirm-password" required placeholder="••••••••"
                        class="w-full border border-gray-300 p-2.5 text-xs focus:outline-none focus:border-black rounded-sm">
                </div>
                <button type="submit" id="btn-update-pass"
                    class="w-full bg-black text-white py-3.5 text-xs uppercase tracking-widest hover:bg-neutral-800 transition font-medium rounded-sm shadow-sm">
                    Set New Password
                </button>
            </form>

            <p id="status-msg" class="text-xs text-center mt-5 font-medium"></p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-white border-t border-gray-900">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row justify-between items-center text-xs text-gray-500 gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-sm font-bold tracking-widest uppercase text-white">AVEN</span>
                <span class="text-gray-600">|</span>
                <p>© 2026 AVEN Apparel. All rights reserved.</p>
            </div>
            <p class="tracking-widest uppercase text-[11px] text-gray-400 font-light">
                Developed by <span class="text-white font-semibold tracking-wider">TANIM HASAN OVI</span>
            </p>
        </div>
    </footer>

    <script>
        const API_BASE = '/api/auth';
        let userEmail = '';
        let verifiedOtp = '';

        function setStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.className = isError ? 'text-xs text-center mt-5 font-medium text-rose-600' : 'text-xs text-center mt-5 font-medium text-emerald-600';
        }

        async function handleSendOtp(e) {
            e.preventDefault();
            userEmail = document.getElementById('reset-email').value.trim();
            const btn = document.getElementById('btn-send-otp');
            btn.disabled = true;
            btn.innerText = 'Sending OTP...';

            try {
                const res = await fetch(`${API_BASE}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await res.json();

                if (res.ok) {
                    setStatus('A 6-digit OTP has been sent to your email.');
                    document.getElementById('step-email-form').classList.add('hidden');
                    document.getElementById('step-otp-form').classList.remove('hidden');
                    document.getElementById('flow-title').innerText = 'Verification';
                    document.getElementById('flow-desc').innerText = `Enter the 6-digit OTP code sent to ${userEmail}`;
                } else {
                    setStatus(data.message || 'Failed to send OTP.', true);
                }
            } catch (err) {
                setStatus('Network connection error.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send 6-Digit OTP';
            }
        }

        async function resendOtp() {
            if (!userEmail) return;
            setStatus('Resending OTP...');
            await fetch(`${API_BASE}/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail })
            });
            setStatus('New OTP sent to your email.');
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();
            const otp = document.getElementById('reset-otp').value.trim();
            if (otp.length !== 6) {
                setStatus('Please enter a valid 6-digit OTP.', true);
                return;
            }

            const btn = document.getElementById('btn-verify-otp');
            btn.disabled = true;
            btn.innerText = 'Verifying...';

            try {
                const res = await fetch(`${API_BASE}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp })
                });
                const data = await res.json();

                if (res.ok) {
                    verifiedOtp = otp;
                    setStatus('OTP verified! Please create a new password.');
                    document.getElementById('step-otp-form').classList.add('hidden');
                    document.getElementById('step-password-form').classList.remove('hidden');
                    document.getElementById('flow-title').innerText = 'New Password';
                    document.getElementById('flow-desc').innerText = 'Set a secure new password for your account.';
                } else {
                    setStatus(data.message || 'Invalid or expired OTP.', true);
                }
            } catch (err) {
                setStatus('Server error during OTP verification.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Verify Code';
            }
        }

        async function handleUpdatePassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword.length < 6) {
                setStatus('Password must be at least 6 characters.', true);
                return;
            }
            if (newPassword !== confirmPassword) {
                setStatus('Passwords do not match! Please recheck.', true);
                return;
            }

            const btn = document.getElementById('btn-update-pass');
            btn.disabled = true;
            btn.innerText = 'Updating...';

            try {
                const res = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp: verifiedOtp, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    setStatus('Password updated successfully! Redirecting to login...');
                    setTimeout(() => window.location.href = '/login.html', 1500);
                } else {
                    setStatus(data.message || 'Failed to update password.', true);
                }
            } catch (err) {
                setStatus('Network error. Please try again.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Set New Password';
            }
        }
    </script>
</body>

</html>
