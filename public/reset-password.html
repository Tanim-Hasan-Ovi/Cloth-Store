<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Set New Password — AVEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white p-8 border border-gray-200 shadow-sm">
        <h2 class="text-xl font-bold uppercase tracking-widest text-center mb-4">New Password</h2>
        <form onsubmit="handleReset(event)" class="space-y-4">
            <input type="password" id="newPass" required placeholder="Enter new password"
                class="w-full text-xs p-3 border border-gray-300 focus:outline-none focus:border-black">
            <button type="submit" id="btn"
                class="w-full bg-black text-white text-xs uppercase tracking-widest py-3 font-semibold hover:bg-neutral-800 transition">Update
                Password</button>
        </form>
        <p id="msg" class="text-xs text-center mt-4"></p>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function handleReset(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPass').value;
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });
            const data = await res.json();
            const msg = document.getElementById('msg');
            msg.innerText = data.message;
            msg.className = res.ok ? 'text-xs text-center mt-4 text-emerald-600' : 'text-xs text-center mt-4 text-rose-600';
            if (res.ok) setTimeout(() => window.location.href = '/login.html', 2000);
        }
    </script>
</body>

</html>
