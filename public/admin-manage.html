<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products — Admin AVEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen text-gray-900 font-sans flex flex-col justify-between">

    <!-- ADMIN HEADER -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">

                <!-- Brand Logo & Admin Badge -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="text-xl font-bold tracking-widest uppercase text-black">AVEN</a>
                    <span
                        class="bg-black text-white text-[10px] uppercase tracking-widest px-2 py-0.5 font-medium rounded-sm">Admin</span>
                </div>

                <!-- Center Nav Links -->
                <nav class="flex space-x-8">
                    <a href="/admin.html"
                        class="text-sm font-medium uppercase tracking-wider text-gray-500 hover:text-black transition">
                        Add Product
                    </a>
                    <a href="/admin-manage.html"
                        class="text-sm font-semibold uppercase tracking-wider text-black border-b-2 border-black pb-1">
                        Manage Products
                    </a>
                </nav>

                <!-- Right Action Links -->
                <div class="flex items-center space-x-6">
                    <a href="/"
                        class="text-xs uppercase tracking-wider text-gray-700 hover:text-black border-b border-gray-400 pb-0.5 transition">View
                        Shop</a>
                    <button onclick="logout()"
                        class="text-xs uppercase bg-black text-white px-4 py-2 hover:bg-gray-800 transition">Logout</button>
                </div>

            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-6 space-y-6 flex-grow w-full">
        <div class="flex justify-between items-center border-b pb-3">
            <div>
                <h2 class="text-xl font-light uppercase tracking-widest text-black">Inventory & Products</h2>
                <p class="text-xs text-gray-500 mt-1">Edit or delete existing store listings.</p>
            </div>
            <button onclick="loadAdminProducts()"
                class="text-xs uppercase border-b border-black pb-0.5 hover:text-gray-500">Refresh List</button>
        </div>

        <div class="bg-white p-6 border border-gray-200 shadow-sm rounded-sm">
            <div id="admin-product-table" class="space-y-4">
                <p class="text-xs text-gray-400">Loading products...</p>
            </div>
        </div>
    </main>

    <!-- EDIT PRODUCT POPUP MODAL -->
    <div id="edit-modal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white p-8 max-w-xl w-full relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="toggleEditModal(false)"
                class="absolute top-4 right-4 text-gray-400 hover:text-black text-xl font-light">&times;</button>
            <h3 class="text-lg font-light uppercase tracking-wider mb-5 border-b pb-2">Edit Product Details</h3>

            <form id="edit-product-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-existing-image">

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Product Title</label>
                    <input type="text" id="edit-title" required class="border p-2 text-sm w-full">
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Category</label>
                    <select id="edit-category" required class="border p-2 text-sm w-full bg-white">
                        <option value="Man">Man</option>
                        <option value="Woman">Woman</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Replace Image (Optional)</label>
                    <input type="file" id="edit-image-file" accept="image/*"
                        class="border p-2 text-sm w-full bg-gray-50">
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Description</label>
                    <textarea id="edit-description" rows="3" required class="border p-2 text-sm w-full"></textarea>
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Price (BDT)</label>
                    <input type="number" id="edit-price" required class="border p-2 text-sm w-full">
                </div>

                <div>
                    <label class="text-xs text-gray-500 font-semibold block mb-2">Stock Quantity per Size</label>
                    <div class="grid grid-cols-5 gap-2">
                        <div>
                            <label class="text-xs text-gray-500 block mb-1 text-center font-medium">Size S</label>
                            <input type="number" id="edit-stock-S" class="border p-2 text-sm w-full text-center" min="0"
                                value="0">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 block mb-1 text-center font-medium">Size M</label>
                            <input type="number" id="edit-stock-M" class="border p-2 text-sm w-full text-center" min="0"
                                value="0">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 block mb-1 text-center font-medium">Size L</label>
                            <input type="number" id="edit-stock-L" class="border p-2 text-sm w-full text-center" min="0"
                                value="0">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 block mb-1 text-center font-medium">Size XL</label>
                            <input type="number" id="edit-stock-XL" class="border p-2 text-sm w-full text-center"
                                min="0" value="0">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 block mb-1 text-center font-medium">Size XXL</label>
                            <input type="number" id="edit-stock-XXL" class="border p-2 text-sm w-full text-center"
                                min="0" value="0">
                        </div>
                    </div>
                </div>

                <button type="submit" id="edit-submit-btn"
                    class="w-full bg-black text-white text-xs uppercase py-3.5 tracking-widest hover:bg-gray-800 transition mt-2">
                    Update Changes
                </button>
            </form>
        </div>
    </div>

    <!-- ADMIN FOOTER -->
    <footer class="bg-black text-white mt-16 border-t border-gray-900">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row justify-between items-center text-xs text-gray-500 gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-sm font-bold tracking-widest uppercase text-white">AVEN</span>
                <span class="text-gray-600">|</span>
                <p>© 2026 Admin Control Portal</p>
            </div>
            <p class="tracking-widest uppercase text-[11px] text-gray-400 font-light">
                Developed by <span class="text-white font-semibold tracking-wider">TANIM HASAN OVI</span>
            </p>
        </div>
    </footer>

    <script>
        const API_BASE = '/api';
        const currentUser = JSON.parse(localStorage.getItem('user'));
        let allProductsCache = [];

        // Admin Auth Guard
        if (!currentUser || currentUser.role !== 'admin') {
            alert('Access denied. Please login as Admin.');
            window.location.href = '/';
        }

        function toggleEditModal(show) {
            document.getElementById('edit-modal').classList.toggle('hidden', !show);
        }

        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        async function uploadImageFile(fileInput) {
            if (!fileInput.files || fileInput.files.length === 0) return null;
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            const res = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            return data.imageUrl;
        }

        async function loadAdminProducts() {
            const table = document.getElementById('admin-product-table');
            const res = await fetch(`${API_BASE}/products`);
            const products = await res.json();
            allProductsCache = products;

            if (!products || products.length === 0) {
                table.innerHTML = '<p class="text-xs text-gray-400 py-6 text-center">No products found in inventory.</p>';
                return;
            }

            table.innerHTML = products.map(p => {
                const sizeOrder = ['S', 'M', 'L', 'XL', 'XXL'];
                const stockDisplay = sizeOrder.map(s => {
                    const v = p.variants.find(item => item.size === s);
                    return `${s}: ${v ? v.quantity : 0}`;
                }).join(', ');

                return `
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 pt-2 text-sm gap-4">
            <div class="flex items-center space-x-4">
              <img src="${p.image || '/uploads/default.png'}" class="w-14 h-16 object-cover border bg-gray-50">
              <div>
                <span class="font-medium text-black">${p.title}</span> — ৳${p.price}
                <span class="text-xs text-gray-500 block mt-1">
                  Category: <strong class="text-black uppercase">${p.category}</strong> | 
                  Stock: <span class="text-gray-700">${stockDisplay}</span>
                </span>
              </div>
            </div>
            <div class="flex space-x-2 self-end sm:self-center">
              <button onclick="openEditModal('${p._id}')" class="text-xs text-indigo-600 border border-indigo-200 px-3 py-1.5 hover:bg-indigo-50 transition">Edit</button>
              <button onclick="deleteProduct('${p._id}')" class="text-xs text-red-600 border border-red-200 px-3 py-1.5 hover:bg-red-50 transition">Delete</button>
            </div>
          </div>
        `;
            }).join('');
        }

        function openEditModal(productId) {
            const p = allProductsCache.find(item => item._id === productId);
            if (!p) return;

            document.getElementById('edit-id').value = p._id;
            document.getElementById('edit-title').value = p.title;
            document.getElementById('edit-category').value = p.category;
            document.getElementById('edit-existing-image').value = p.image || '';
            document.getElementById('edit-image-file').value = '';
            document.getElementById('edit-description').value = p.description;
            document.getElementById('edit-price').value = p.price;

            document.getElementById('edit-stock-S').value = p.variants.find(v => v.size === 'S')?.quantity || 0;
            document.getElementById('edit-stock-M').value = p.variants.find(v => v.size === 'M')?.quantity || 0;
            document.getElementById('edit-stock-L').value = p.variants.find(v => v.size === 'L')?.quantity || 0;
            document.getElementById('edit-stock-XL').value = p.variants.find(v => v.size === 'XL')?.quantity || 0;
            document.getElementById('edit-stock-XXL').value = p.variants.find(v => v.size === 'XXL')?.quantity || 0;

            toggleEditModal(true);
        }

        document.getElementById('edit-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('edit-submit-btn');
            btn.innerText = 'Updating...';
            btn.disabled = true;

            try {
                const id = document.getElementById('edit-id').value;
                const fileInput = document.getElementById('edit-image-file');
                let imageUrl = document.getElementById('edit-existing-image').value;

                if (fileInput.files.length > 0) {
                    imageUrl = await uploadImageFile(fileInput);
                }

                const payload = {
                    title: document.getElementById('edit-title').value,
                    category: document.getElementById('edit-category').value,
                    image: imageUrl,
                    description: document.getElementById('edit-description').value,
                    price: Number(document.getElementById('edit-price').value),
                    variants: [
                        { size: 'S', quantity: Number(document.getElementById('edit-stock-S').value) },
                        { size: 'M', quantity: Number(document.getElementById('edit-stock-M').value) },
                        { size: 'L', quantity: Number(document.getElementById('edit-stock-L').value) },
                        { size: 'XL', quantity: Number(document.getElementById('edit-stock-XL').value) },
                        { size: 'XXL', quantity: Number(document.getElementById('edit-stock-XXL').value) }
                    ]
                };

                const res = await fetch(`${API_BASE}/products/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Product Updated Successfully!');
                    toggleEditModal(false);
                    loadAdminProducts();
                } else {
                    alert('Failed to update product');
                }
            } catch (err) {
                alert('Error updating product: ' + err.message);
            } finally {
                btn.innerText = 'Update Changes';
                btn.disabled = false;
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            await fetch(`${API_BASE}/products/${id}`, { method: 'DELETE' });
            loadAdminProducts();
        }

        loadAdminProducts();
    </script>
</body>

</html>
