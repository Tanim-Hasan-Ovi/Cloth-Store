<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders — Admin AVEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen text-gray-900 font-sans flex flex-col justify-between">

    <!-- ADMIN HEADER -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">

                <!-- Brand Logo & Admin Badge -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="text-xl font-bold tracking-widest uppercase text-black">AVEN</a>
                    <span
                        class="bg-black text-white text-[10px] uppercase tracking-widest px-2 py-0.5 font-medium rounded-sm">Admin</span>
                </div>

                <!-- Center Nav Links -->
                <nav class="flex space-x-8">
                    <a href="/admin-orders.html"
                        class="text-sm font-semibold uppercase tracking-wider text-black border-b-2 border-black pb-1">
                        Customer Orders
                    </a>
                    <a href="/admin.html"
                        class="text-sm font-medium uppercase tracking-wider text-gray-500 hover:text-black transition">
                        Add Product
                    </a>
                    <a href="/admin-manage.html"
                        class="text-sm font-medium uppercase tracking-wider text-gray-500 hover:text-black transition">
                        Manage Products
                    </a>
                </nav>

                <!-- Right Action Links -->
                <div class="flex items-center space-x-6">
                    <a href="/"
                        class="text-xs uppercase tracking-wider text-gray-700 hover:text-black border-b border-gray-400 pb-0.5 transition">View
                        Shop</a>
                    <button onclick="logout()"
                        class="text-xs uppercase bg-black text-white px-4 py-2 hover:bg-gray-800 transition">Logout</button>
                </div>

            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 space-y-6 flex-grow w-full">
        <div class="flex justify-between items-center border-b pb-3">
            <div>
                <h2 class="text-xl font-light uppercase tracking-widest text-black">Customer Orders</h2>
                <p class="text-xs text-gray-500 mt-1">Real-time list of all placed orders, items, and delivery details.
                </p>
            </div>
            <button onclick="loadOrders()"
                class="text-xs uppercase border-b border-black pb-0.5 hover:text-gray-500">Refresh Orders</button>
        </div>

        <div class="bg-white border border-gray-200 shadow-sm rounded-sm overflow-hidden">
            <div id="orders-container" class="divide-y divide-gray-200">
                <p class="text-xs text-gray-400 p-6 text-center">Loading orders...</p>
            </div>
        </div>
    </main>

    <!-- ADMIN FOOTER -->
    <footer class="bg-black text-white mt-16 border-t border-gray-900">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row justify-between items-center text-xs text-gray-500 gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-sm font-bold tracking-widest uppercase text-white">AVEN</span>
                <span class="text-gray-600">|</span>
                <p>© 2026 Admin Control Portal</p>
            </div>
            <p class="tracking-widest uppercase text-[11px] text-gray-400 font-light">
                Developed by <span class="text-white font-semibold tracking-wider">TANIM HASAN OVI</span>
            </p>
        </div>
    </footer>

    <script>
        const API_BASE = '/api';
        const currentUser = JSON.parse(localStorage.getItem('user'));
        const currentToken = localStorage.getItem('token');

        // Admin Auth Guard
        if (!currentUser || currentUser.role !== 'admin' || !currentToken) {
            alert('Access denied. Please login as Admin.');
            window.location.href = '/';
        }

        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        async function loadOrders() {
            const container = document.getElementById('orders-container');
            try {
                const res = await fetch(`${API_BASE}/orders/all`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                if (!res.ok) throw new Error('Failed to fetch orders');
                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-400 p-8 text-center">No customer orders placed yet.</p>';
                    return;
                }

                container.innerHTML = orders.map(order => {
                    const date = new Date(order.createdAt).toLocaleDateString('en-GB', {
                        day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    const itemsList = order.items.map(item => `
            <div class="flex justify-between items-center text-xs py-1 border-b border-gray-100 last:border-0">
              <div class="font-medium text-black">
                ${item.title || 'Apparel Item'} 
                <span class="text-gray-500 font-normal">(${item.size})</span>
              </div>
              <div class="text-gray-600">
                Qty: ${item.quantity} × ৳${item.price} = <span class="font-semibold text-black">৳${item.price * item.quantity}</span>
              </div>
            </div>
          `).join('');

                    const addr = order.shippingAddress || {};
                    const fullAddress = [addr.street, addr.city, addr.postalCode, addr.country].filter(Boolean).join(', ') || 'Address not provided';

                    return `
            <div class="p-6 space-y-4 hover:bg-gray-50/50 transition">
              <!-- Order Top Bar -->
              <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-gray-100 pb-3">
                <div class="flex items-center space-x-3">
                  <span class="font-bold text-sm text-black">Order #${order._id.slice(-6).toUpperCase()}</span>
                  <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 bg-indigo-50 text-indigo-700 font-semibold border border-indigo-200">
                    ${order.status || 'Pending'}
                  </span>
                </div>
                <span class="text-xs text-gray-400">${date}</span>
              </div>

              <!-- Customer & Shipping Information -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs bg-gray-50 p-3 rounded-sm">
                <div>
                  <span class="text-gray-400 uppercase tracking-wider block font-medium">Customer Details</span>
                  <p class="font-semibold text-black mt-0.5">${order.user?.name || 'Customer'}</p>
                  <p class="text-gray-600">${order.user?.email || 'N/A'}</p>
                  <p class="text-gray-600">Phone: ${order.user?.phone || 'Not provided'}</p>
                </div>
                <div>
                  <span class="text-gray-400 uppercase tracking-wider block font-medium">Delivery Address</span>
                  <p class="text-gray-700 mt-0.5 leading-relaxed">${fullAddress}</p>
                </div>
              </div>

              <!-- Ordered Items Table -->
              <div class="border border-gray-100 p-3 rounded-sm bg-white space-y-1">
                <span class="text-[11px] text-gray-400 uppercase tracking-wider block mb-2 font-medium">Ordered Products</span>
                ${itemsList}
              </div>

              <!-- Total Amount -->
              <div class="flex justify-between items-center pt-2">
                <span class="text-xs text-gray-500 uppercase tracking-wider">Total Bill</span>
                <span class="text-base font-bold text-black">৳ ${order.totalAmount}</span>
              </div>
            </div>
          `;
                }).join('');

            } catch (err) {
                container.innerHTML = `<p class="text-xs text-red-500 p-6 text-center">Error: ${err.message}</p>`;
            }
        }

        loadOrders();
    </script>
</body>

</html>
