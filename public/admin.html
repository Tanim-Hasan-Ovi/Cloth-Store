<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — AVEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen text-gray-900 font-sans">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold tracking-widest uppercase">AVEN</a>
            <div class="space-x-4">
                <a href="/" class="text-xs uppercase tracking-wider border-b border-black pb-0.5">View Shop</a>
                <button onclick="logout()"
                    class="text-xs uppercase bg-black text-white px-3 py-1.5 hover:bg-gray-800">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-6 space-y-10">
        <h2 class="text-2xl font-light uppercase tracking-widest border-b pb-4">Admin Dashboard</h2>

        <!-- Add Product Form -->
        <div class="bg-white p-6 border border-gray-200">
            <h3 class="text-sm font-semibold uppercase tracking-wider mb-4">Add New Product</h3>
            <form id="add-product-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="title" placeholder="Product Title" required
                        class="border p-2 text-sm w-full">
                    <!-- Category Select Option -->
                    <select id="category" required class="border p-2 text-sm w-full bg-white">
                        <option value="" disabled selected>Select Category</option>
                        <option value="Man">Man</option>
                        <option value="Woman">Woman</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-500 block mb-1">Product Image</label>
                    <input type="file" id="image-file" accept="image/*" class="border p-2 text-sm w-full bg-gray-50">
                </div>
                <textarea id="description" placeholder="Description" required
                    class="border p-2 text-sm w-full"></textarea>
                <input type="number" id="price" placeholder="Price (BDT)" required class="border p-2 text-sm w-full">

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="text-xs text-gray-500">Size S Stock</label>
                        <input type="number" id="stock-S" class="border p-2 text-sm w-full" value="0" min="0">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Size M Stock</label>
                        <input type="number" id="stock-M" class="border p-2 text-sm w-full" value="0" min="0">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Size L Stock</label>
                        <input type="number" id="stock-L" class="border p-2 text-sm w-full" value="0" min="0">
                    </div>
                </div>
                <button type="submit" id="add-submit-btn"
                    class="w-full bg-black text-white text-xs uppercase py-3 tracking-widest hover:bg-gray-800">Publish
                    Product</button>
            </form>
        </div>

        <!-- Manage Products -->
        <div class="bg-white p-6 border border-gray-200">
            <h3 class="text-sm font-semibold uppercase tracking-wider mb-4">Manage Products</h3>
            <div id="admin-product-table" class="space-y-3"></div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 max-w-lg w-full mx-4 relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleEditModal(false)"
                class="absolute top-4 right-4 text-gray-500 hover:text-black">&times;</button>
            <h3 class="text-lg font-semibold uppercase tracking-wider mb-4">Edit Product</h3>
            <form id="edit-product-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-existing-image">
                <div>
                    <label class="text-xs text-gray-500">Title</label>
                    <input type="text" id="edit-title" required class="border p-2 text-sm w-full">
                </div>
                <div>
                    <label class="text-xs text-gray-500">Category</label>
                    <!-- Category Select in Edit Modal -->
                    <select id="edit-category" required class="border p-2 text-sm w-full bg-white">
                        <option value="Man">Man</option>
                        <option value="Woman">Woman</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-500 block mb-1">Change Image (Optional)</label>
                    <input type="file" id="edit-image-file" accept="image/*"
                        class="border p-2 text-sm w-full bg-gray-50">
                </div>
                <div>
                    <label class="text-xs text-gray-500">Description</label>
                    <textarea id="edit-description" required class="border p-2 text-sm w-full"></textarea>
                </div>
                <div>
                    <label class="text-xs text-gray-500">Price (BDT)</label>
                    <input type="number" id="edit-price" required class="border p-2 text-sm w-full">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs text-gray-500">Stock S</label>
                        <input type="number" id="edit-stock-S" class="border p-2 text-sm w-full" min="0">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Stock M</label>
                        <input type="number" id="edit-stock-M" class="border p-2 text-sm w-full" min="0">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Stock L</label>
                        <input type="number" id="edit-stock-L" class="border p-2 text-sm w-full" min="0">
                    </div>
                </div>
                <button type="submit" id="edit-submit-btn"
                    class="w-full bg-black text-white text-xs uppercase py-3 tracking-widest hover:bg-gray-800">Update
                    Changes</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        const currentUser = JSON.parse(localStorage.getItem('user'));
        let allProductsCache = [];

        if (!currentUser || currentUser.role !== 'admin') {
            alert('Access denied. Please login as Admin.');
            window.location.href = '/';
        }

        function toggleEditModal(show) { document.getElementById('edit-modal').classList.toggle('hidden', !show); }

        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        async function uploadImageFile(fileInput) {
            if (!fileInput.files || fileInput.files.length === 0) return null;
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            const res = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            return data.imageUrl;
        }

        async function loadAdminProducts() {
            const table = document.getElementById('admin-product-table');
            const res = await fetch(`${API_BASE}/products`);
            const products = await res.json();
            allProductsCache = products;

            table.innerHTML = products.map(p => `
        <div class="flex justify-between items-center border-b pb-3 pt-2 text-sm">
          <div class="flex items-center space-x-3">
            <img src="${p.image || '/uploads/default.png'}" class="w-12 h-12 object-cover border">
            <div>
              <span class="font-medium">${p.title}</span> — ৳${p.price}
              <span class="text-xs text-gray-500 block">Category: <strong class="text-black">${p.category}</strong> | Stock: ${p.variants.map(v => `${v.size}:${v.quantity}`).join(', ')}</span>
            </div>
          </div>
          <div class="space-x-2">
            <button onclick="openEditModal('${p._id}')" class="text-xs text-indigo-600 border border-indigo-200 px-2.5 py-1 hover:bg-indigo-50">Edit</button>
            <button onclick="deleteProduct('${p._id}')" class="text-xs text-red-600 border border-red-200 px-2.5 py-1 hover:bg-red-50">Delete</button>
          </div>
        </div>
      `).join('');
        }

        function openEditModal(productId) {
            const p = allProductsCache.find(item => item._id === productId);
            if (!p) return;
            document.getElementById('edit-id').value = p._id;
            document.getElementById('edit-title').value = p.title;
            document.getElementById('edit-category').value = p.category;
            document.getElementById('edit-existing-image').value = p.image || '';
            document.getElementById('edit-image-file').value = '';
            document.getElementById('edit-description').value = p.description;
            document.getElementById('edit-price').value = p.price;
            document.getElementById('edit-stock-S').value = p.variants.find(v => v.size === 'S')?.quantity || 0;
            document.getElementById('edit-stock-M').value = p.variants.find(v => v.size === 'M')?.quantity || 0;
            document.getElementById('edit-stock-L').value = p.variants.find(v => v.size === 'L')?.quantity || 0;
            toggleEditModal(true);
        }

        document.getElementById('edit-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const fileInput = document.getElementById('edit-image-file');
            let imageUrl = document.getElementById('edit-existing-image').value;
            if (fileInput.files.length > 0) imageUrl = await uploadImageFile(fileInput);

            const payload = {
                title: document.getElementById('edit-title').value,
                category: document.getElementById('edit-category').value,
                image: imageUrl,
                description: document.getElementById('edit-description').value,
                price: Number(document.getElementById('edit-price').value),
                variants: [
                    { size: 'S', quantity: Number(document.getElementById('edit-stock-S').value) },
                    { size: 'M', quantity: Number(document.getElementById('edit-stock-M').value) },
                    { size: 'L', quantity: Number(document.getElementById('edit-stock-L').value) }
                ]
            };

            const res = await fetch(`${API_BASE}/products/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('Product Updated!');
                toggleEditModal(false);
                loadAdminProducts();
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Are you sure?')) return;
            await fetch(`${API_BASE}/products/${id}`, { method: 'DELETE' });
            loadAdminProducts();
        }

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('image-file');
            let imageUrl = '';
            if (fileInput.files.length > 0) imageUrl = await uploadImageFile(fileInput);

            const payload = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                image: imageUrl,
                description: document.getElementById('description').value,
                price: Number(document.getElementById('price').value),
                variants: [
                    { size: 'S', quantity: Number(document.getElementById('stock-S').value) },
                    { size: 'M', quantity: Number(document.getElementById('stock-M').value) },
                    { size: 'L', quantity: Number(document.getElementById('stock-L').value) }
                ]
            };

            await fetch(`${API_BASE}/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert('Product Published!');
            document.getElementById('add-product-form').reset();
            loadAdminProducts();
        });

        loadAdminProducts();
    </script>
</body>

</html>
