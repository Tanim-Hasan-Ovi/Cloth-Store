<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product — Admin AVEN</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Favicon / Tab Logo -->
    <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body class="bg-gray-50 min-h-screen text-gray-900 font-sans flex flex-col justify-between">

    <!-- ADMIN HEADER -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">

                <!-- Brand Logo & Admin Badge -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="text-xl font-bold tracking-widest uppercase text-black">AVEN</a>
                    <span
                        class="bg-black text-white text-[10px] uppercase tracking-widest px-2 py-0.5 font-medium rounded-sm">Admin</span>
                </div>

                <!-- Center Nav Links -->
                <nav class="flex space-x-8">
                    <a href="/admin-orders.html"
                        class="text-sm font-medium uppercase tracking-wider text-gray-500 hover:text-black transition">
                        Customer Orders
                    </a>
                    <a href="/admin.html"
                        class="text-sm font-semibold uppercase tracking-wider text-black border-b-2 border-black pb-1">
                        Add Product
                    </a>
                    <a href="/admin-manage.html"
                        class="text-sm font-medium uppercase tracking-wider text-gray-500 hover:text-black transition">
                        Manage Products
                    </a>
                </nav>

                <!-- Right Action Links -->
                <div class="flex items-center space-x-6">
                    <a href="/"
                        class="text-xs uppercase tracking-wider text-gray-700 hover:text-black border-b border-gray-400 pb-0.5 transition">View
                        Shop</a>
                    <button onclick="logout()"
                        class="text-xs uppercase bg-black text-white px-4 py-2 hover:bg-gray-800 transition">Logout</button>
                </div>

            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-6 flex-grow w-full">
        <div class="border-b pb-3">
            <h2 class="text-xl font-light uppercase tracking-widest text-black">Create New Listing</h2>
            <p class="text-xs text-gray-500 mt-1">Fill out the details below to publish a product to the catalog.</p>
        </div>

        <div class="bg-white p-6 border border-gray-200 shadow-sm rounded-sm">
            <form id="add-product-form" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Product Title</label>
                        <input type="text" id="title" placeholder="e.g. Classic Linen Shirt" required
                            class="border p-2.5 text-sm w-full focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Category</label>
                        <select id="category" required
                            class="border p-2.5 text-sm w-full bg-white focus:outline-none focus:border-black">
                            <option value="" disabled selected>Select Target Category</option>
                            <option value="Man">Man</option>
                            <option value="Woman">Woman</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Product Image (Choose File)</label>
                    <input type="file" id="image-file" accept="image/*" class="border p-2 text-sm w-full bg-gray-50">
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Description</label>
                    <textarea id="description" placeholder="Short description of the garment..." rows="3" required
                        class="border p-2.5 text-sm w-full focus:outline-none focus:border-black"></textarea>
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Price (BDT)</label>
                    <input type="number" id="price" placeholder="e.g. 2450" required
                        class="border p-2.5 text-sm w-full focus:outline-none focus:border-black">
                </div>

                <div>
                    <label class="text-xs text-gray-500 font-semibold block mb-2">Inventory Stock by Size</label>
                    <div class="grid grid-cols-5 gap-2">
                        <div>
                            <span class="text-xs text-gray-600 block mb-1 text-center font-medium">Size S</span>
                            <input type="number" id="stock-S" class="border p-2 text-sm w-full text-center" value="0"
                                min="0">
                        </div>
                        <div>
                            <span class="text-xs text-gray-600 block mb-1 text-center font-medium">Size M</span>
                            <input type="number" id="stock-M" class="border p-2 text-sm w-full text-center" value="0"
                                min="0">
                        </div>
                        <div>
                            <span class="text-xs text-gray-600 block mb-1 text-center font-medium">Size L</span>
                            <input type="number" id="stock-L" class="border p-2 text-sm w-full text-center" value="0"
                                min="0">
                        </div>
                        <div>
                            <span class="text-xs text-gray-600 block mb-1 text-center font-medium">Size XL</span>
                            <input type="number" id="stock-XL" class="border p-2 text-sm w-full text-center" value="0"
                                min="0">
                        </div>
                        <div>
                            <span class="text-xs text-gray-600 block mb-1 text-center font-medium">Size XXL</span>
                            <input type="number" id="stock-XXL" class="border p-2 text-sm w-full text-center" value="0"
                                min="0">
                        </div>
                    </div>
                </div>

                <button type="submit" id="add-submit-btn"
                    class="w-full bg-black text-white text-xs uppercase py-3.5 tracking-widest hover:bg-gray-800 transition font-medium">
                    Publish Product
                </button>
            </form>
        </div>
    </main>

    <!-- ADMIN FOOTER -->
    <footer class="bg-black text-white mt-16 border-t border-gray-900">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row justify-between items-center text-xs text-gray-500 gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-sm font-bold tracking-widest uppercase text-white">AVEN</span>
                <span class="text-gray-600">|</span>
                <p>© 2026 Admin Control Portal</p>
            </div>
            <p class="tracking-widest uppercase text-[11px] text-gray-400 font-light">
                Developed by <span class="text-white font-semibold tracking-wider">TANIM HASAN OVI</span>
            </p>
        </div>
    </footer>

    <script>
        const API_BASE = '/api';
        const currentUser = JSON.parse(localStorage.getItem('user'));

        // Admin Auth Guard
        if (!currentUser || currentUser.role !== 'admin') {
            alert('Access denied. Please login as Admin.');
            window.location.href = '/';
        }

        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        async function uploadImageFile(fileInput) {
            if (!fileInput.files || fileInput.files.length === 0) return null;
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            const res = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            return data.imageUrl;
        }

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('add-submit-btn');
            btn.innerText = 'Publishing...';
            btn.disabled = true;

            try {
                const fileInput = document.getElementById('image-file');
                let imageUrl = '';
                if (fileInput.files.length > 0) {
                    imageUrl = await uploadImageFile(fileInput);
                }

                const payload = {
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    image: imageUrl,
                    description: document.getElementById('description').value,
                    price: Number(document.getElementById('price').value),
                    variants: [
                        { size: 'S', quantity: Number(document.getElementById('stock-S').value) },
                        { size: 'M', quantity: Number(document.getElementById('stock-M').value) },
                        { size: 'L', quantity: Number(document.getElementById('stock-L').value) },
                        { size: 'XL', quantity: Number(document.getElementById('stock-XL').value) },
                        { size: 'XXL', quantity: Number(document.getElementById('stock-XXL').value) }
                    ]
                };

                const res = await fetch(`${API_BASE}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Product Published Successfully!');
                    document.getElementById('add-product-form').reset();
                } else {
                    alert('Failed to publish product');
                }
            } catch (err) {
                alert('Error publishing product');
            } finally {
                btn.innerText = 'Publish Product';
                btn.disabled = false;
            }
        });

        localStorage.removeItem('aven_cart');
        localStorage.removeItem('cart');
    </script>
</body>

</html>
